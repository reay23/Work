<!DOCTYPE html>
<html>
<head>
  <title>Your Cart</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="cart.js"></script>
  <script src="website.js"></script>
</head>
<body class="min-h-screen">
<nav class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[95%] max-w-7xl h-16 px-6 flex items-center justify-between rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl shadow-blck/20">
  <a href="main.html" class="flex items-center gap-3">
    <img src="images/reres_fits_logo_bold.png" alt="Rere's Fits" class="w-9 h-9" />
    <span class="font-['Fraunces'] text-white text-lg font-medium">Rere's Fits</span>
  </a>

  <div class="hidden md:flex items-center gap-8 font-['Manrope'] text-sm text-blue-100/70">
    <a href="main.html" class="text-white hover:text-white transition-colors">menu</a>
    <a href="checkout.html" class="text-white hover:text-white transition-colors ">checkout</a>
  </div>

  <a href="cart.html" class="relative flex items-center justify-center w-10 h-10 rounded-full bg-blue-500/10 border border-blue-400/30 hover:border-blue-400 transition-colors">
    🛍️
    <span id="nav-cart-count" class="absolute -top-1.5 -right-1.5 bg-blue-500 text-[#0B1220] text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
  </a>
</nav>

<main class="min-h-screen bg-[#0B1220] px-6 md:px-16 lg:px-24 py-16 md:py-24">

  <div class="max-w-5xl mx-auto">

    <p class="cart-eyebrow font-['Manrope'] text-xs md:text-sm uppercase tracking-[0.4em] text-blue-400 mb-4">
      Your Selection
    </p>
    <h1 class="cart-heading font-['Fraunces'] text-white text-3xl md:text-5xl font-medium mb-12">
      Your Cart
    </h1>

    <div class="grid md:grid-cols-3 gap-10">

      <div class="md:col-span-2 space-y-4" id="cart-items-list">

        <div class="cart-item flex gap-4 md:gap-6 bg-blue-500/5 border border-blue-900/40 rounded-2xl p-4 md:p-5">
          <img src="product-placeholder.jpg" alt="Product name" class="w-20 h-24 md:w-24 md:h-28 object-cover rounded-xl flex-shrink-0" />

          <div class="flex-1 flex flex-col justify-between">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="font-['Manrope'] font-semibold text-white text-sm md:text-base">Product Name</h3>
                <p class="font-['Manrope'] text-blue-100/50 text-xs md:text-sm mt-1">Size M · Blue</p>
              </div>
              <button class="cart-remove-btn font-['Manrope'] text-blue-100/40 hover:text-red-400 text-xs transition-colors" data-item-id="">
                Remove
              </button>
            </div>

            <div class="flex items-center justify-between mt-4">
              <div class="flex items-center gap-3 bg-blue-500/10 rounded-full px-3 py-1.5">
                <button class="qty-decrease text-blue-100/70 hover:text-white w-5" data-item-id="">−</button>
                <span class="qty-value font-['Manrope'] text-white text-sm w-4 text-center">1</span>
                <button class="qty-increase text-blue-100/70 hover:text-white w-5" data-item-id="">+</button>
              </div>
              <span class="item-price font-['Manrope'] text-blue-300 font-semibold text-sm md:text-base">₦0.00</span>
            </div>
          </div>
        </div>
        <div id="cart-empty-state" class="hidden text-center py-20 border border-dashed border-blue-900/50 rounded-2xl">
          <p class="font-['Fraunces'] italic text-blue-100/60 text-xl mb-3">Your cart is feeling a little bare.</p>
          <a href="index.html#product" class="font-['Manrope'] text-blue-400 hover:text-white text-sm underline underline-offset-4">
            Go find something to layer in
          </a>
        </div>

      </div>

      <div class="cart-summary md:col-span-1">
        <div class="bg-blue-500/5 border border-blue-900/40 rounded-2xl p-6 md:sticky md:top-24">
          <h3 class="font-['Fraunces'] text-white text-xl mb-6">Order Summary</h3>

          <div class="space-y-3 font-['Manrope'] text-sm">
            <div class="flex justify-between text-blue-100/70">
              <span>Subtotal</span>
              <span id="cart-subtotal" class="text-white">₦0.00</span>
            </div>
            <div class="flex justify-between text-blue-100/70">
              <span>Shipping</span>
              <span class="text-blue-100/50">Calculated at checkout</span>
            </div>
          </div>

          <div class="h-px bg-blue-900/50 my-5"></div>

          <div class="flex justify-between font-['Manrope'] font-semibold text-white text-base mb-8">
            <span>Total</span>
            <span id="cart-total">₦0.00</span>
          </div>

          <button id="checkout" onclick="window.location.href='checkout.html'"
            class="w-full bg-blue-500 hover:bg-blue-400 text-[#0B1220] font-['Manrope'] font-semibold py-3.5 rounded-full transition-colors">
            Proceed to Checkout
          </button>
        </div>
      </div>

    </div>
  </div>
</main>

<script>
  function initCartAnimations() {
    if (typeof gsap === 'undefined' || !document.getElementById('cart-items-list')) return;

    gsap.registerPlugin(ScrollTrigger);

    const cartTl = gsap.timeline();

    cartTl
      .from('.cart-eyebrow', { opacity: 0, y: 16, duration: 0.5, ease: 'power2.out' })
      .from('.cart-heading', { opacity: 0, y: 24, duration: 0.7, ease: 'power3.out' }, '-=0.2')
      .from('.cart-item', { opacity: 0, y: 20, duration: 0.6, ease: 'power2.out', stagger: 0.1 }, '-=0.3')
      .from('.cart-summary', { opacity: 0, y: 20, duration: 0.6, ease: 'power2.out' }, '-=0.4');
  }

  document.addEventListener('DOMContentLoaded', initCartAnimations);
</script>
</body>
</html>
